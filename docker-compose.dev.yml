version: '3.8'

services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    volumes:
      - ./services/api:/app
      - ./:/app_root
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:////app_root/hidewin.db
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./services/web:/app
    environment:
      - VITE_API_URL=http://127.0.0.1:8000
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
