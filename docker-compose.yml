version: '3.8'

services:
  api:
    build:
      context: ./services/api
    ports:
      - "8000:8000"
    volumes:
      - data_volume:/app/data
    environment:
      - APP_ENV=production
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./data/hidewin.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  web:
    build:
      context: ./services/web
      args:
        # In cloud environments, replace this with your actual public API URL
        - VITE_API_URL=/api
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  data_volume:
