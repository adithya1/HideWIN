services:
  api-service:
    build:
      context: ./hidewin-fastapi
    ports:
      - "8000:8000"
    volumes:
      - ./hidewin-fastapi:/app
    environment:
      - PYTHONUNBUFFERED=1

  whisper-server:
    build:
      context: ./whisper-server
    ports:
      - "8001:8001"
    volumes:
      - ./whisper-server:/app
    environment:
      - PYTHONUNBUFFERED=1

  cloud-relay:
    build:
      context: ./hidewin-cloud-relay
    ports:
      - "9000:9000"
    volumes:
      - ./hidewin-cloud-relay:/app
      # Mount the Web UI so the Relay can serve the Guest static files
      - ./Hide-Win-Web:/Hide-Win-Web
    environment:
      - PYTHONUNBUFFERED=1

  web-client:
    image: node:20
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./Hide-Win-Web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
