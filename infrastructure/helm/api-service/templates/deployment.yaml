apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-service.fullname" . }}
  labels:
    app: api-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      serviceAccountName: {{ include "api-service.serviceAccountName" . }}
      # Graceful shutdown period
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          # Resource requests and limits to ensure predictable scheduling
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          # Startup probe to allow initial slow DB connection booting
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          # Liveness probe to restart deadlocked containers
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          # Readiness probe to remove from ALB target group if DB is down
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: {{ include "api-service.fullname" . }}-config
          env:
            # Secret references pulled from AWS Secrets Manager / External Secrets
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          # Lifecycle hooks for graceful shutdown (SIGTERM handling)
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"] # Allow ALB connection draining
