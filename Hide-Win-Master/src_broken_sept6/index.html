<!doctype html>
<html>
    <head>
<script>
window.onerror = function(message, source, lineno, colno, error) { console.error('GLOBAL_ERROR:', message, source, lineno, colno, error);
    if (window.hideWin && window.hideWin.ipcRenderer) {
        window.hideWin.ipcRenderer.send('log-error', message + ' at ' + source + ':' + lineno);
    }
};
window.addEventListener('unhandledrejection', function(e) { console.error('UNHANDLED_REJECTION:', e.reason); });
</script>
        <meta http-equiv="content-security-policy" content="script-src 'self' 'unsafe-inline'" />
        <title>HideWin</title>
        
        <style>
            /* Make the electron app behave like a native draggable widget */
            .app-header {
                -webkit-app-region: drag;
            }
            html, body {
            overflow-x: hidden;
                width: 100%;
                height: 100%;
            }
            body, html, * {
                -webkit-app-region: no-drag;
            }
            
                        :root {
                color-scheme: light;
                /* Light Mode Backgrounds */
                --bg-app: #ffffff;
                --bg-surface: #f3f4f6;
                --bg-elevated: #ffffff;
                --bg-hover: #e5e7eb;

                /* Text */
                --text-primary: #111827;
                --text-secondary: #4b5563;
                --text-muted: #9ca3af;

                /* Borders & Lines */
                --border: #e5e7eb;
                --border-strong: #d1d5db;

                /* Accent */
                --accent: #2563eb;
                --accent-hover: #1d4ed8;

                /* Status */
                --success: #16a34a;
                --warning: #ca8a04;
                --danger: #dc2626;
                
                
                /* Spacing */
                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 16px;
                --space-lg: 24px;
                --space-xl: 32px;
                --space-2xl: 48px;
                
                --font: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            }
            
            
            html.is-session {
                background-color: transparent !important;
                backdrop-filter: none !important;
            }
            html.is-session body {
            overflow-x: hidden;
                background-color: transparent !important;
                backdrop-filter: none !important;
                box-shadow: none !important;
                border: none !important;
            }
            body {
            overflow-x: hidden;
                background-color: var(--bg-app);
                backdrop-filter: blur(16px);
                margin: 0;
                overflow: hidden;
            }
        
            
/* POSH LEAN SCROLLBAR */
::-webkit-scrollbar { width: 6px !important; height: 6px !important; background-color: transparent !important; }
::-webkit-scrollbar-track { background: transparent !important; }
::-webkit-scrollbar-thumb { background-color: #d4d4d8 !important; border-radius: 10px !important; }
::-webkit-scrollbar-thumb:hover { background-color: #a1a1aa !important; }
::-webkit-scrollbar-button:single-button:vertical:decrement { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a1a1aa'><path d='M7 14l5-5 5 5z'/></svg>") !important; background-size: 8px !important; background-position: center !important; background-repeat: no-repeat !important; height: 12px !important; display: block !important; }
::-webkit-scrollbar-button:single-button:vertical:increment { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23a1a1aa'><path d='M7 10l5 5 5-5z'/></svg>") !important; background-size: 8px !important; background-position: center !important; background-repeat: no-repeat !important; height: 12px !important; display: block !important; }

</style>
        <script>
            if (window.location.search.includes('windowType=session')) {
                document.documentElement.classList.add('is-session');
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        </script>
        <script src="utils/renderer.js"></script>
    </head>
    <body>
        <script src="assets/marked-4.3.0.min.js"></script>
        <script src="assets/highlight-11.9.0.min.js"></script>
        <link rel="stylesheet" href="assets/highlight-vscode-dark.min.css" />
        <script src="assets/ort.min.js"></script><script src="assets/vad-bundle.js"></script><script type="module" src="components/app/HideWinApp.js"></script>

        <hide-win-app id="appRoot"></hide-win-app>

</html>
