<!doctype html>
<html>
    <head>
<script>
window.onerror = function(message, source, lineno, colno, error) { 
    console.error('GLOBAL_ERROR_DETAIL:', message, source, lineno, colno, error ? error.stack : '');
};
window.addEventListener('unhandledrejection', function(e) {
    let reason = e.reason;
    let msg = reason;
    if (reason instanceof Error) msg = reason.stack || reason.message;
    else if (reason && typeof reason === 'object') {
        try { msg = JSON.stringify(reason, Object.getOwnPropertyNames(reason)); } catch(ex) { msg = String(reason); }
    }
    console.error('UNHANDLED_REJECTION_DETAIL:', msg);
});
window.addEventListener('error', function(e) {
    if (e.target && e.target.tagName) {
        console.error('RESOURCE_ERROR:', e.target.tagName, e.target.src || e.target.href);
    }
}, true);
</script>

            .app-header {
                -webkit-app-region: drag;
            }
            body, html, * {
                -webkit-app-region: no-drag;
            }
            
                        :root {
                color-scheme: light;
                /* Light Mode Backgrounds */
                --bg-app: #ffffff;
                --bg-surface: #f3f4f6;
                --bg-elevated: #ffffff;
                --bg-hover: #e5e7eb;

                /* Text */
                --text-primary: #111827;
                --text-secondary: #4b5563;
                --text-muted: #9ca3af;

                /* Borders & Lines */
                --border: #e5e7eb;
                --border-strong: #d1d5db;

                /* Accent */
                --accent: #2563eb;
                --accent-hover: #1d4ed8;

                /* Status */
                --success: #16a34a;
                --warning: #ca8a04;
                --danger: #dc2626;
                
                
                /* Spacing */
                --space-xs: 4px;
                --space-sm: 8px;
                --space-md: 16px;
                --space-lg: 24px;
                --space-xl: 32px;
                --space-2xl: 48px;
                
                --font: 'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            }
            
            
            html.is-session {
                background-color: transparent !important;
                backdrop-filter: none !important;
            }
            html.is-session body {
            overflow-x: hidden;
                background-color: transparent !important;
                backdrop-filter: none !important;
                box-shadow: none !important;
                border: none !important;
            }
            html, body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                background-color: transparent !important;
            }
            ::-webkit-scrollbar {
        width: 4px;
        height: 4px;
    }
    ::-webkit-scrollbar-track {
        background: transparent;
    }
    ::-webkit-scrollbar-thumb {
        background: rgba(150, 150, 150, 0.3);
        border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
        background: rgba(150, 150, 150, 0.6);
    }
    ::-webkit-scrollbar-corner {
        background: transparent;
    }
        </style>
